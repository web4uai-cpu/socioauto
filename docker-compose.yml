# Local development stack for the Social Media AI Agent Platform.
# Usage: docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://socialmedia:socialmedia@postgres:5432/socialmedia_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: celery -A src.orchestrator.tasks.celery_app worker --loglevel=info --queues=orchestrator
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://socialmedia:socialmedia@postgres:5432/socialmedia_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  beat:
    build: .
    command: celery -A src.orchestrator.tasks.celery_app beat --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://socialmedia:socialmedia@postgres:5432/socialmedia_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialmedia
      POSTGRES_PASSWORD: socialmedia
      POSTGRES_DB: socialmedia_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
