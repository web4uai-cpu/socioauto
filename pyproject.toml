[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerated migrations are machine-written; don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# PEP 8 (E/W), pyflakes (F), import sorting (I), bugbear (B)
select = ["E", "W", "F", "I", "B"]

# FastAPI relies on calling Depends()/Security() in argument defaults — the standard
# recommended exception to flake8-bugbear's B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Security",
    "Depends", "Query", "Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
