# Copy to secrets.yaml, fill in real base64 values, and apply — never commit the real file.
# Generate a value with: echo -n 'my-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: socialmedia-ai-secrets
  namespace: socialmedia-ai
type: Opaque
data:
  # APP_ENV=production makes the API fail-fast if JWT_SECRET_KEY/APP_ENCRYPTION_KEY are unset.
  APP_ENV: ""            # base64 of "production"
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET_KEY: ""
  APP_ENCRYPTION_KEY: ""
  LLM_API_KEY: ""
  OAUTH_REDIRECT_BASE: ""
  # Platform OAuth2 client credentials (authorization-code flow)
  X_CLIENT_ID: ""
  X_CLIENT_SECRET: ""
  X_API_KEY: ""
  X_API_SECRET: ""
  LINKEDIN_CLIENT_ID: ""
  LINKEDIN_CLIENT_SECRET: ""
  META_APP_ID: ""
  META_APP_SECRET: ""
  META_WEBHOOK_VERIFY_TOKEN: ""
  TIKTOK_CLIENT_KEY: ""
  TIKTOK_CLIENT_SECRET: ""
  X_WEBHOOK_SECRET: ""
  # Billing. STRIPE_WEBHOOK_SECRET is required for /webhooks/stripe to accept deliveries.
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_STARTER: ""
  STRIPE_PRICE_PRO: ""
  STRIPE_PRICE_AGENCY: ""
  STRIPE_PRICE_ENTERPRISE: ""
  # Public URL of the frontend, used to build Stripe Checkout return URLs.
  APP_BASE_URL: ""
# Note: every key above except APP_ENV, DATABASE_URL, REDIS_URL, JWT_SECRET_KEY, and
# APP_ENCRYPTION_KEY can alternatively be set from the admin dashboard
# (Integrations panel), which stores them encrypted in the database and takes
# precedence over these values.
