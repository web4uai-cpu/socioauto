apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialmedia-ai-ingress
  namespace: socialmedia-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["api.socialmediaai.example.com"]
      secretName: socialmedia-ai-tls
  rules:
    - host: api.socialmediaai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: socialmedia-ai-api
                port: { number: 80 }
